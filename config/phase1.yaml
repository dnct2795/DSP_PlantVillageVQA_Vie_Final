# Phase 1 config — official 3-step pipeline (see docs/PIPELINE.md)
dataset:
  repo_id: SyedNazmusSakib/PlantVillageVQA
  # Pinned after Step 1.1. null = use the current main branch and record its commit sha.
  revision: a025a438308eff9a7289231ebc09e27e8ec6678c
  # Tabular QA file inside the HF repo. null = auto-detect (reported in Step 1.1).
  qa_file: PlantVillageVQA/PlantVillageVQA.csv  # member of PlantVillageVQA.zip (identical to the JSON copy)

# Column names in the QA table. null = auto-detect by name; Step 1.1 reports what was chosen.
columns:
  id: null
  split: null
  question_type: null
  question: null
  answer: null
  image: null

sampling:
  fraction: 0.125
  seed: 42
  strata: [split, question_type]
  min_per_stratum: 1

paths:
  raw_dir: data/raw          # downloaded metadata (git-ignored)
  step1_dir: outputs/step1   # reports + subset

step2:
  out_dir: outputs/step2        # pairs, question table, batches (deterministic, committed)
  run_dir: runs/step2           # append-only checkpoints + run_log.jsonl
  glossary: config/glossary.yaml
  max_pairs_per_batch: 40
  # Lệnh gọi Claude (gói Pro, KHÔNG --bare). Prompt + schema được thêm vào bởi runner.
  claude_cmd: [claude, -p, --model, sonnet, --output-format, json, --max-turns, "1", --tools, ""]
  timeout_s: 600

step3:
  run_dir: runs/step3           # append-only checkpoints + run_log.jsonl
  max_pairs_per_call: 40        # nhiều cặp mỗi lần gọi: mỗi lần gọi Codex tốn ~7,7k token cố định
  # Judge: Codex (gói ChatGPT Plus). Ghim model ở đây, không dựa vào ~/.codex/config.toml.
  # Chọn 2026-10-27: gpt-6-luna (rẻ, nhanh) + reasoning high. Nếu smoke test bỏ sót lỗi hiển nhiên
  # sau khi đã sửa prompt judge -> chuyển sang judge_fallback và ghi lý do vào quality report.
  judge_model: gpt-6-luna
  judge_reasoning: high
  judge_fallback: {model: gpt-6.1-sol, reasoning: low}
  codex_cmd: [codex, exec, --sandbox, read-only, --skip-git-repo-check, --ephemeral]
  timeout_s: 600
